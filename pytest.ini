[pytest]
# Only our tests. proof_corpus/ vendors third-party suites (Cryptolib) that ship
# their own pytest.ini and fail to collect without generated test vectors --
# a bare `pytest` at the repo root otherwise reports 4 collection errors that
# have nothing to do with this project.
testpaths = integration/tests

markers =
    integration: exercises a real EasyCrypt binary or a live API; excluded from the default run
