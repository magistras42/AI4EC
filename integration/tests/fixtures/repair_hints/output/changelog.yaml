        kind: lemma_renamed
        identifiers: [FMap, frng]
        summary: New lemmas about how frng changes after a .[x <- v] update; the old rewrite form no longer applies directly.
        repair_hint: Use the new frng_set lemma instead of manually unfolding frng after an update.
        relevance: medium
