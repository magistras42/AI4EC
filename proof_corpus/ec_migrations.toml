[[migration]]
id = "proc-star-removed"
kind = "syntax_change"
breaks_at = "r2023.09"
confidence = "high"
summary = """
  The `proc *` marker (a distinguished/initialising procedure in a module type) is no
  longer parsed. Drop the star; current EasyCrypt infers this from usage.
  """

  [migration.match]
  matches_regex = '\bproc\s+\*\s'

  [[migration.action]]
  op = "replace_regex"
  pattern = '\bproc\s+\*\s'
  replacement = "proc "

  [migration.provenance]
  commits = ["57be028cc", "df8a2f924"]
  note = """
    r2023.09 commits 'strip out code related to proc *' and 'Remove parser support for
    `proc *` in module sigs'.
    """

[[migration]]
id = "declare-module-ascription"
kind = "syntax_change"
breaks_at = "r2023.09"
confidence = "high"
summary = "`declare module X : T` (bare ascription) is now `declare module X <: T`."

  [migration.match]
  matches_regex = '\bdeclare\s+module\s+(\w+)\s*:\s'

  [[migration.action]]
  op = "replace_regex"
  pattern = '\bdeclare\s+module\s+(\w+)\s*:\s'
  replacement = 'declare module \1 <: '

  [migration.provenance]
  commits = ["dc50f44bf", "6d0e46493"]
  note = """
    r2023.09 commits 'Forbid the usage of [declare] for concrete modules' and 'Enforce
    section restrictions on the types of declared modules'.
    """

[[migration]]
id = "old-module-restriction-sets"
kind = "syntax_change"
breaks_at = "r2024.09"
confidence = "medium"
summary = """
  Unprefixed module-restriction sets like `{RO, Adv}` are no longer accepted; current
  syntax is `{-RO, -Adv}`. The `old_mem_restr` pragma restores the old reading without
  touching every site, which keeps line numbers stable.
  """

  [migration.match]
  matches_regex = '\{\s*[A-Z]\w*\s*(,\s*[A-Z]\w*\s*)*\}'

  [[migration.action]]
  op = "add_pragma"
  pragma = "+old_mem_restr"

  [migration.provenance]
  commits = ["b53230696", "9b940b4f5"]
  note = """
    r2024.09 commits 'simplify representation of memory restriction (#569)' and
    'Simplify/clean up memory/call restrictions'. The pragma is a compatibility shim,
    not a port.
    """

